name: Blog Draft Generator

on:
  schedule:
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Optional zero-based index of an unused topic or a topic held for legal review"
        required: false
        type: string

concurrency:
  group: blog-draft-generator
  cancel-in-progress: false

jobs:
  generate:
    # Only main can distribute drafts and update the production queue.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7.0.1
        with:
          # A rerun must read the current queue, including any delivery reservation.
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install PyPDF2==3.0.1

      - name: Run blog generator
        shell: bash
        run: |
          generator_args=(--persist-topic-state)
          if [[ -n "$REQUESTED_TOPIC_INDEX" ]]; then
            generator_args+=(--topic-index "$REQUESTED_TOPIC_INDEX")
          fi
          PYTHONPATH="$PWD" python generate_and_publish.py "${generator_args[@]}"
        env:
          REQUESTED_TOPIC_INDEX: ${{ inputs.topic_index }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          OPENAI_HTTP_MAX_ATTEMPTS: ${{ vars.OPENAI_HTTP_MAX_ATTEMPTS || '6' }}
          OPENAI_HTTP_TIMEOUT_SECONDS: ${{ vars.OPENAI_HTTP_TIMEOUT_SECONDS || '300' }}
          OPENAI_RESPONSE_MAX_ATTEMPTS: ${{ vars.OPENAI_RESPONSE_MAX_ATTEMPTS || '3' }}
          OPENAI_POLL_TIMEOUT_SECONDS: ${{ vars.OPENAI_POLL_TIMEOUT_SECONDS || '600' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Upload legal memorandum diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: legal-memo-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated_blog_runs/${{ github.run_id }}_${{ github.run_attempt }}_*_legal_memo.json
          retention-days: 14
          if-no-files-found: ignore
